name: Secret scan

# PR と main への push で、API キーなどが混ざっていないかを調べる（Claude は使わない）。中身は共通部品 satou-aaaaa/shared-workflows。
on:
  pull_request:
  push:
    branches: [main]
  # 公開後の確認（Post-deploy check）の差し戻しの PR で、検査を起こすのに使う（GITHUB_TOKEN の PR では pull_request が動かない）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: satou-aaaaa/shared-workflows/.github/workflows/secret-scan.yml@main
