name: Post-deploy check

# 公開（GitHub Pages）が終わるたびに、公開されたページをブラウザで開いて壊れていないかを見る（Claude は使わない）。
# 壊れていれば、最後に正常だった版（タグ last-good）の中身に戻す PR を作ってマージし、公開し直す。
# 失敗すると ci-failure-issue.yml が Issue を立て、担当エージェントが直して出し直す。中身は共通部品 satou-aaaaa/shared-workflows。
on:
  workflow_run:
    # Actions から公開するリポジトリは、その公開ワークフローの name も足す
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: satou-aaaaa/shared-workflows/.github/workflows/post-deploy.yml@main
    with:
      # トップページのほかに開いてみるページ（.html だけ。空白区切り）
      paths: ''
      # ブランチから公開するリポジトリは true。Actions から公開するなら dispatch に公開ワークフローのファイル名を書く
      pages_build: true
