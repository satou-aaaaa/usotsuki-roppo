<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>うそつき六法</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ねじれ文字に書き換えられた六法の本を、1ページずつ直して札に封じる学習ゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 夜の書庫：本棚で巻を選ぶ → 1ページに条文1つ。うその言葉をタップ → 札で正しい言葉をはめ、ねじれ文字を封じる */
:root{
  --sky1:#0d1030; --sky2:#232a5c; --sky3:#3b3570;
  --page:#f6efdd; --page2:#ecdfbf; --ink:#2a2420; --muted:#7a6f63; --line:#d9cdb3;
  --gold:#e7b04f; --lamp:#ffcf73; --lie:#b0352b; --fix:#2f6e4f; --card:#fffaf0; --fuda:#f3e6c4; --seal:#b3261e;
  --text:#efe8d8;
  --display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
/* 夜の書庫は明るい設定でも暗い設定でも同じ色にする（紙の白さだけ少し落とす） */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#eee5cd;--card:#f6efdd}}
:root[data-theme="dark"]{--page:#eee5cd;--card:#f6efdd}
*{box-sizing:border-box}
html{background:var(--sky1)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 32% 8%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 58% 22%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 76% 12%,#fffa 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 30%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 44% 36%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 6% 44%,#fff7 50%,transparent 51%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%);
  background-attachment:fixed}
body.dawn{--sky1:#2b2a5e;--sky2:#b0628a;--sky3:#f4b26b}
.moon{position:fixed;top:22px;right:max(22px,8vw);width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7dc,#f1d98f 60%,#d9b862);box-shadow:0 0 40px 10px #f6d77a33;pointer-events:none}
body.dawn .moon{background:radial-gradient(circle at 50% 50%,#fff3c4,#ffc35a 70%);box-shadow:0 0 70px 30px #ffbe5a55;top:auto;bottom:120px}
.wrap{position:relative;max-width:600px;margin:0 auto;padding-block:20px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-right:64px}
h1{font-family:var(--display);font-size:clamp(28px,8vw,40px);margin:0;line-height:1.1;letter-spacing:.06em;color:var(--lamp);
  text-shadow:0 0 18px #ffbf4f55}
.sub{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:.1em}
.stat{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-size:20px;color:var(--lamp)}
button{font:inherit}
.btn{all:unset;cursor:pointer;background:linear-gradient(180deg,#ffd27e,var(--gold));color:#2a1d08;font-weight:700;padding:10px 22px;border-radius:999px;
  box-shadow:0 3px 0 #a8742a,0 6px 16px #0006;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8742a}
.btn.sub2{background:transparent;color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn:focus-visible,.w:focus-visible,.card:focus-visible,.spine:focus-visible,.none:focus-visible{outline:3px solid #fff;outline-offset:3px}
.prolog{margin:0;font-size:14px;opacity:.9}
/* 本棚 */
.shelf{position:relative;display:flex;gap:8px;align-items:flex-end;justify-content:center;padding:18px 12px 0;
  background:linear-gradient(180deg,#3a2616,#2a1a0e);border-radius:12px;box-shadow:inset 0 -14px 0 #1c1009,0 10px 30px #0008;min-height:220px}
.spine{all:unset;cursor:pointer;position:relative;width:min(15%,72px);border-radius:5px 5px 2px 2px;color:#f6e8c4;
  background:linear-gradient(90deg,#0004,transparent 18%,transparent 82%,#0005),var(--c);
  display:grid;justify-items:center;align-content:start;padding:12px 0 10px;gap:8px;margin-bottom:14px;
  box-shadow:0 4px 0 #0005;transition:transform .2s}
.spine:hover{transform:translateY(-6px)}
.spine .t{writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(15px,4.4vw,20px);letter-spacing:.2em;line-height:1}
.spine .band{width:70%;height:3px;background:var(--gold);opacity:.8}
.spine .n{font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}
.spine.done{box-shadow:0 0 0 2px var(--lamp),0 0 22px 4px #ffcf7355}
.spine.done::after{content:"✦";position:absolute;top:-16px;color:var(--lamp);font-size:14px;text-shadow:0 0 8px var(--lamp)}
.hint{font-size:12px;opacity:.75;margin:0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* 本のページ */
.stage{perspective:1400px}
.page{position:relative;background:
   radial-gradient(ellipse at 30% 20%,#fff8 0,transparent 55%),
   linear-gradient(90deg,#c9b68a 0,var(--page2) 3%,var(--page) 10%,var(--page) 94%,var(--page2) 100%);
  color:var(--ink);border-radius:4px 14px 14px 4px;padding:16px 18px 18px 26px;display:grid;gap:12px;min-height:300px;
  box-shadow:0 1px 0 #fff inset,0 18px 40px #000a,-6px 0 0 var(--c,#6b4b2a);transform-origin:left center}
.page.turn{animation:turn .5s cubic-bezier(.2,.7,.3,1)}
@keyframes turn{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
.page.boss{box-shadow:0 1px 0 #fff inset,0 18px 40px #000a,-6px 0 0 var(--c,#6b4b2a),0 0 0 3px #6b3fa0,0 0 34px 6px #8e5bd055}
.head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.art{font-family:var(--display);font-size:16px;color:#6a4a2a}
.chip{font-size:12px;background:#2a2042;color:#e8dbff;border-radius:999px;padding:1px 10px}
.streak{font-size:12px;color:#a8541a;font-weight:700;margin:0}
.text{font-family:var(--display);font-size:20px;line-height:2.15;letter-spacing:.02em}
.w{all:unset;cursor:pointer;border-bottom:2px dotted #b9a983;padding:0 1px;border-radius:3px}
.w:hover{background:#efe2bf}
.w.lie{color:var(--lie);display:inline-block;animation:twist 1.4s ease-in-out infinite;border-bottom:none;text-decoration:line-through wavy;text-decoration-thickness:1.5px}
@keyframes twist{0%,100%{transform:skewX(0) rotate(0)}25%{transform:skewX(-14deg) rotate(-2deg)}75%{transform:skewX(12deg) rotate(2deg)}}
.w.fixed{color:var(--fix);border-bottom:2px solid var(--fix);animation:glow 1.2s ease}
.w.ans{color:var(--fix);border-bottom:2px solid var(--fix)}
.w.miss{background:#f3d3cc}
@keyframes glow{from{background:#fff1b8;box-shadow:0 0 18px #ffd86a}to{background:transparent}}
.text.done .w{cursor:default}
.q{font-size:13px;color:var(--muted);margin:0}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{all:unset;cursor:pointer;position:relative;background:linear-gradient(180deg,#fffdf6,var(--fuda));border:1.5px solid #c9a96a;border-radius:4px;
  padding:10px 14px 10px 26px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #c9a96a,0 6px 12px #0002;font-family:var(--display)}
.card::before{content:"札";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--seal)}
.card:hover{transform:translateY(-2px)}
.none{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid #b9a983;color:var(--ink);justify-self:start}
.res{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#efe6cf;border-radius:10px;padding:10px 12px}
.res p{margin:0;font-size:14px}
.res b{font-size:16px;font-family:var(--display)}
.go{justify-self:end}
/* ねじれ文字（魔）と札 */
.mon{width:64px;height:64px;overflow:visible}
.mon.big{width:84px;height:84px}
.mon .body{animation:wob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wob{0%,100%{scale:1 1}50%{scale:1.06 .94}}
.lurk{display:flex;align-items:center;gap:10px;font-size:13px;color:#5b3f86;margin:0}
.lurk .mon{animation:rise .5s ease-out}
@keyframes rise{from{transform:translateY(16px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.fuda{position:relative;width:62px;height:88px;background:linear-gradient(180deg,#fffaf0,var(--fuda));border:2px solid var(--seal);border-radius:3px;
  display:grid;place-items:center;box-shadow:0 4px 10px #0003}
.fuda .mon{width:48px;height:48px;animation:suck .8s cubic-bezier(.5,0,.3,1) both}
@keyframes suck{from{transform:scale(2.2) rotate(-40deg);opacity:1}70%{opacity:1}to{transform:scale(.8) rotate(0);opacity:.85}}
.fuda .stamp{position:absolute;bottom:4px;right:4px;width:24px;height:24px;border-radius:4px;background:var(--seal);color:#fff;
  font-family:var(--display);font-size:15px;display:grid;place-items:center;animation:stamp .4s .6s both}
@keyframes stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.flee .mon{animation:flee 1s ease-in forwards}
@keyframes flee{to{transform:translate(40px,-24px) rotate(30deg) scale(.6);opacity:.15}}
/* 巻の終わり・封じ帳 */
.panel{background:#151838cc;border:1px solid #ffffff22;border-radius:14px;padding:16px;display:grid;gap:12px}
.panel h2{font-family:var(--display);font-size:24px;margin:0;color:var(--lamp)}
.panel p{margin:0}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:2px;text-align:center;font-size:11px;min-width:0}
.slot .nm{font-family:var(--display);font-size:13px;color:#ffd9d2;text-decoration:line-through wavy #ff8a80;overflow-wrap:anywhere}
.slot.out{opacity:.45}
.slot .q2{font-family:var(--display);font-size:28px;opacity:.4;height:52px;display:grid;place-items:center}
.cho h3{font-family:var(--display);font-size:16px;margin:6px 0 0;color:var(--lamp)}
/* 村 */
.town{width:100%;height:auto;display:block;margin-top:6px}
.town .win{fill:#2a2a3a}
.town .win.lit{fill:var(--lamp);filter:drop-shadow(0 0 4px #ffcf73)}
footer{display:grid;gap:6px;font-size:12px;opacity:.8}
footer p{margin:0}
footer a{color:var(--lamp)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>うそつき六法</h1>
      <p class="sub">封じの六法</p>
    </div>
    <div class="stat" id="stat"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <svg class="town" id="town" viewBox="0 0 600 90" aria-label="村の灯り" role="img"></svg>

  <footer>
    <p>条文は「<a href="https://satou-aaaaa.github.io/tenbin/">天秤の書</a>」の照合済みの問題と、e-Gov 法令検索の条文で確かめ、短く言い換えたものです。記録はこの端末のブラウザにだけ残ります。法律相談ではありません。</p>
    <p><a href="classic.html">前の版（夜の村で見分ける）</a></p>
    <p class="support">気に入ったら <a id="kofi" href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener noreferrer">Ko-fi で応援する</a>（任意・遊ぶのは無料のまま）</p>
  </footer>
</div>

<script>
// 6冊の本。ページ：w＝言葉のかたまり、lie＝書き換えられたかたまりの番号（無ければ -1）、bad＝うその言葉、alt＝ほかの札2枚、why＝答え合わせの一言
// 各巻の最後のページは「大きな魔」（うそが必ずある）。条文は e-Gov 法令検索で確かめた（2026-10-31）
const BOOKS = [
 {id:"ken", name:"憲法", c:"#7c2633", pages:[
  {id:"ken1", art:"憲法41条", w:["国会は、","国権の","最高機関","であって、国の","唯一の","立法機関である。"], lie:4, bad:"主な", alt:["最初の","臨時の"], why:"法律を作れるのは国会だけ、という意味。"},
  {id:"ken2", art:"憲法96条", w:["憲法改正は、","各議院の","総議員の","3分の2以上","の賛成で国会が発議し、","国民投票","にかける。"], lie:3, bad:"過半数", alt:["4分の3以上","5分の1以上"], why:"発議は総議員の3分の2以上。国民投票では過半数の賛成が要る。"},
  {id:"ken3", art:"憲法38条2項", w:["拷問や","脅迫による","自白は、","証拠と","することができない。"], lie:-1, why:"うそは無いページ。自白だけが証拠なら有罪にできない決まりもある（38条3項）。"},
  {id:"ken4", art:"憲法69条", w:["不信任が可決されたら、","内閣は","10日以内","に衆議院を解散しない限り、","総辞職する。"], lie:2, bad:"30日以内", alt:["3日以内","1年以内"], why:"衆議院が不信任を決めたら、10日以内に解散か総辞職。"},
  {id:"ken5", art:"憲法39条", w:["実行の時に","適法だった","行為は、","後から","罰せられない。"], lie:-1, why:"うそは無いページ。後からできた法律で、さかのぼって罰することはできない。"},
  {id:"ken6", art:"憲法79条2項", w:["最高裁の裁判官は、","任命後初めての","衆議院議員総選挙","のときに、","国民審査","を受ける。"], lie:2, bad:"参議院議員通常選挙", alt:["統一地方選挙","知事選挙"], why:"その後も、10年たつごとの総選挙でまた審査を受ける。"}
 ]},
 {id:"min", name:"民法", c:"#2f5a3c", pages:[
  {id:"min1", art:"民法4条", w:["年齢","18歳","をもって、","成年","とする。"], lie:1, bad:"20歳", alt:["16歳","15歳"], why:"2022年4月から、成年は18歳。"},
  {id:"min2", art:"民法522条", w:["契約は、","申込みと承諾がそろえば、","書面がなくても","成立する。"], lie:2, bad:"契約書を作ってはじめて", alt:["印鑑を押してはじめて","代金を払ってはじめて"], why:"口約束でも原則成立する。保証契約など、書面が要る例外はある。"},
  {id:"min3", art:"民法5条", w:["未成年者が","親の同意なしに","した契約は、","取り消す","ことができる。"], lie:-1, why:"うそは無いページ。ただし、おこづかいなど処分を許された財産の範囲なら取り消せない（5条3項）。"},
  {id:"min4", art:"民法961条", w:["15歳","になれば、","遺言","をすることができる。"], lie:0, bad:"18歳", alt:["20歳","12歳"], why:"遺言は15歳から。親の同意も要らない。"},
  {id:"min5", art:"民法121条", w:["取り消された契約は、","初めから","無効だったものと","みなす。"], lie:1, bad:"取り消した時から", alt:["1年たってから","裁判が終わってから"], why:"取り消すと、初めにさかのぼって無効になる。"},
  {id:"min6", art:"民法96条3項", w:["だまされてした契約の取消しは、","知らず、落ち度もない","第三者には","主張できない。"], lie:1, bad:"知らなかっただけの", alt:["事情を知っていた","落ち度のある"], why:"2020年の改正で、知らなかったうえに落ち度もない第三者だけが守られるようになった。"}
 ]},
 {id:"kei", name:"刑法", c:"#3d3a6e", pages:[
  {id:"kei1", art:"刑法41条", w:["14歳","に満たない者の","行為は、","罰しない。"], lie:0, bad:"18歳", alt:["16歳","12歳"], why:"刑法では、14歳未満の行為は罰しない。"},
  {id:"kei2", art:"刑法36条1項", w:["急迫不正の侵害に対して、","自分や他人の権利を","守るため、","やむを得ずにした行為は、","罰しない。"], lie:-1, why:"うそは無いページ（正当防衛）。やりすぎると、刑が軽くなるだけのこともある（36条2項）。"},
  {id:"kei3", art:"刑法199条", w:["人を殺した者は、","死刑又は無期若しくは","5年以上","の拘禁刑に処する。"], lie:2, bad:"3年以上", alt:["10年以上","1年以上"], why:"殺人の刑の下の限りは5年。"},
  {id:"kei4", art:"刑法9条", w:["主刑は、死刑・","拘禁刑","・罰金・","拘留","・科料。"], lie:1, bad:"懲役", alt:["禁錮","労役"], why:"2025年6月から、懲役と禁錮は拘禁刑にまとまった。"},
  {id:"kei5", art:"刑法235条", w:["他人の物を盗んだ者は、","10年以下","の拘禁刑か、","50万円以下","の罰金。"], lie:-1, why:"うそは無いページ（窃盗罪）。"},
  {id:"kei6", art:"刑法39条", w:["心神喪失者の行為は罰しない。","心神耗弱者の","行為は、","刑を","減軽する。"], lie:4, bad:"免除する。", alt:["重くする。","そのままにする。"], why:"罰しないのは心神喪失のとき。心神耗弱なら刑を軽くする。"}
 ]},
 {id:"sho", name:"商法", c:"#7a5520", pages:[

  {id:"sho2", art:"会社法30条1項", w:["発起人が作った","定款は、","公証人の認証","を受けなければ、","効力を生じない。"], lie:-1, why:"うそは無いページ。定款は電子データで作ってもよい（26条2項）。"},
  {id:"sho3", art:"会社法332条1項", w:["取締役の任期は、","原則として","2年","まで。"], lie:2, bad:"4年", alt:["1年","5年"], why:"監査役は4年。公開会社でない会社は、定款で10年まで延ばせる。"},
  {id:"sho4", art:"会社法339条1項", w:["役員は、","いつでも、","株主総会の決議で","解任できる。"], lie:1, bad:"正当な理由があるときだけ、", alt:["任期が終わってから、","裁判所の許可を得て、"], why:"ただし正当な理由なく解任したら、会社は損害を賠償する（339条2項）。"},
  {id:"sho5", art:"商法512条", w:["商人が","営業の範囲内で","他人のために行為をしたときは、","相当な報酬","を請求できる。"], lie:-1, why:"うそは無いページ。商人は、約束がなくても報酬を求められる。"},
  {id:"sho6", art:"会社法299条1項", w:["公開会社の","株主総会の招集通知は、","総会の","2週間前","までに出す。"], lie:3, bad:"1週間前", alt:["1か月前","3日前"], why:"公開会社でない会社は、原則1週間前でよい。"}
 ]},
 {id:"mso", name:"民事訴訟法", c:"#255866", pages:[
  {id:"mso1", art:"民事訴訟法368条1項", w:["少額訴訟は、","60万円以下","のお金の支払いを","求める訴えで使える。"], lie:1, bad:"140万円以下", alt:["10万円以下","300万円以下"], why:"簡易裁判所で、早く終わらせるための手続。"},
  {id:"mso2", art:"民事訴訟法377条", w:["少額訴訟の判決には、","控訴","することが","できない。"], lie:3, bad:"できる。", alt:["2回までできる。","弁護士ならできる。"], why:"不服なら、2週間以内に同じ裁判所へ異議を申し立てる（378条）。"},
  {id:"mso3", art:"民事訴訟法246条", w:["裁判所は、","当事者が","申し立てていない","事項について、","判決できない。"], lie:-1, why:"うそは無いページ。何を求めるかを決めるのは当事者。"},
  {id:"mso4", art:"民事訴訟法285条", w:["控訴は、","判決の送達を受けた日から","2週間","以内にする。"], lie:2, bad:"1か月", alt:["1週間","3か月"], why:"2週間を過ぎると控訴できない（不変期間）。"},
  {id:"mso5", art:"民事訴訟法4条1項", w:["訴えは原則として、","訴えられる人","の住所地の","裁判所に起こす。"], lie:-1, why:"うそは無いページ。訴えられる側（被告）の住所地が基本。"},
  {id:"mso6", art:"民事訴訟法371条", w:["少額訴訟で調べる証拠は、","すぐに調べられるもの","に限られる。"], lie:1, bad:"書面", alt:["証人の話","専門家の鑑定"], why:"1回の期日で終わらせるため、その場で調べられる証拠だけ。"}
 ]},
 {id:"kso", name:"刑事訴訟法", c:"#5a2a55", pages:[
  {id:"kso1", art:"刑事訴訟法198条2項", w:["取調べの前には、","あらかじめ、","言いたくないことは言わなくてよい","と告げなければならない。"], lie:2, bad:"うそをつくと罪になる", alt:["弁護人は呼べない","調書に必ず署名する"], why:"黙秘権を知らせる決まり。"},
  {id:"kso2", art:"刑事訴訟法30条", w:["被告人や","被疑者は、","いつでも","弁護人を","選べる。"], lie:-1, why:"うそは無いページ。家族も、独立して弁護人を選べる。"},
  {id:"kso3", art:"刑事訴訟法203条1項", w:["警察は、","逮捕から","48時間","以内に","検察官へ送る。"], lie:2, bad:"72時間", alt:["24時間","1週間"], why:"検察官は受け取ってから24時間以内、逮捕から通じて72時間以内に勾留を求める（205条）。"},
  {id:"kso4", art:"刑事訴訟法208条", w:["勾留の期間は、請求の日から","10日","。やむを得ないときは、","さらに10日まで","延ばせる。"], lie:1, bad:"20日", alt:["3日","30日"], why:"10日以内に起訴しなければ釈放する。"},
  {id:"kso5", art:"刑事訴訟法319条2項", w:["自白が","自分に不利な","唯一の証拠なら、","有罪と","されない。"], lie:-1, why:"うそは無いページ。自白だけでは有罪にできない。"},
  {id:"kso6", art:"刑事訴訟法373条", w:["刑事事件の","控訴の期間は、","14日","と決まっている。"], lie:2, bad:"30日", alt:["7日","3か月"], why:"判決が告げられた日から数える（358条）。"}

];
const ALL = BOOKS.flatMap((b) => b.pages.map((p) => Object.assign(p, { book: b })));
const MONS = ALL.filter((p) => p.lie >= 0);
const KEY = "roppo-seal-v1";

// 記録：solved[ページid]=true（封じた・うそが無いと見破った）。ブラウザが記録を拒んでも遊べるようにする
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); return { solved: (s && s.solved) || {} }; } catch (e) { return { solved: {} }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* 記録できなくても続ける */ } }
let mem = load();
let S = null; // 遊んでいる巻：{b, list, i, st, cards, got, lost, streak, best}
const $ = (id) => document.getElementById(id);
const view = () => $("view");
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const solvedIn = (b) => b.pages.filter((p) => mem.solved[p.id]).length;
const allDone = () => ALL.every((p) => mem.solved[p.id]);
const bossOf = (b) => b.pages[b.pages.length - 1];

// ページの並び：大きな魔のページ（最後）は必ず最後、ほかは毎回まぜる。only を渡すとそのページだけ
function makeOrder(b, only) {
  const boss = bossOf(b);
  const rest = shuffle(b.pages.slice(0, -1).filter((p) => !only || only.includes(p)));
  return !only || only.includes(boss) ? rest.concat(boss) : rest;
}

// ねじれ文字（魔）の絵：ページごとに形が決まる墨のかたまり
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function monster(p, big) {
  const r = rng(hash(p.id)), n = 9, pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, rad = (big ? 34 : 28) + r() * 12; pts.push([Math.cos(a) * rad, Math.sin(a) * rad * 0.9 + 4]); }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], f = (q) => q.map((v) => v.toFixed(1)).join(" ");
  let d = "M" + f(mid(pts[n - 1], pts[0]));
  for (let i = 0; i < n; i++) d += " Q" + f(pts[i]) + " " + f(mid(pts[i], pts[(i + 1) % n]));
  const ex = 9 + r() * 5, ey = -4 - r() * 6, er = 6 + r() * 4, tilt = (r() - 0.5) * 30;
  const eye = (x) => `<circle cx="${x.toFixed(1)}" cy="${ey.toFixed(1)}" r="${er.toFixed(1)}" fill="#fff6dd"/><circle cx="${(x + (r() - 0.5) * 4).toFixed(1)}" cy="${(ey + 1.5).toFixed(1)}" r="${(er * 0.45).toFixed(1)}" fill="#1a1020"/>`;
  const horns = big ? `<path d="M-18 -30 L-26 -50 L-8 -34Z M18 -30 L26 -50 L8 -34Z" fill="${p.book.c}"/>` : "";
  return `<svg class="mon${big ? " big" : ""}" viewBox="-60 -60 120 120" aria-hidden="true"><g transform="rotate(${tilt.toFixed(0)})"><g class="body">${horns}` +
    `<path d="${d}" fill="#231a33" stroke="${p.book.c}" stroke-width="4"/>${eye(-ex)}${eye(ex)}` +
    `<path d="M-10 14 l5 -4 l5 4 l5 -4 l5 4" fill="none" stroke="#ff8a80" stroke-width="2.5" stroke-linecap="round"/></g></g></svg>`;
}

// 上の数字と村の灯り（取り戻した巻の数だけ家に灯りがともる。6冊で夜明け）
function frame() {
  const sealed = MONS.filter((p) => mem.solved[p.id]).length;
  $("stat").innerHTML = `封じた魔 <b>${sealed}</b> / ${MONS.length}`;
  let h = '<path d="M0 90 L0 70 Q150 52 300 66 T600 60 L600 90Z" fill="#0b0d22"/>';
  BOOKS.forEach((b, i) => {
    const x = 30 + i * 95, y = 40 + (i % 2) * 6, lit = solvedIn(b) === b.pages.length;
    h += `<path d="M${x} ${y + 40} V${y + 12} L${x + 22} ${y - 4} L${x + 44} ${y + 12} V${y + 40}Z" fill="#141733"/>` +
      `<rect class="win${lit ? " lit" : ""}" data-book="${b.id}" x="${x + 15}" y="${y + 18}" width="14" height="12" rx="2"/>`;
  });
  $("town").innerHTML = h;
  document.body.classList.toggle("dawn", allDone());
}

// 本棚
function shelf() {
  S = null; frame();
  const done = allDone();
  let h = done ? '<div class="panel" id="dawn"><h2>夜明け！</h2><p>六法をすべて取り戻した。村じゅうに灯りがともった。</p></div>'
    : '<p class="prolog">夜のうちに、ねじれ文字が六法の言葉をうそに書き換えた。うその言葉を見つけ、正しい札で封じよう。</p>';
  h += '<div class="shelf" id="shelf">' + BOOKS.map((b, i) => {
    const n = solvedIn(b), full = n === b.pages.length;
    return `<button class="spine${full ? " done" : ""}" data-book="${b.id}" style="--c:${b.c};height:${170 + (i % 3) * 14}px" aria-label="${b.name}の巻（${n}/${b.pages.length}）">` +
      `<span class="band"></span><span class="t">${b.name}</span><span class="band"></span><span class="n">${n}/${b.pages.length}</span></button>`;
  }).join("") + "</div>";
  h += '<p class="hint">本をタップして開く。どの巻からでもよい。</p><div class="row"><button class="btn sub2" id="cho">封じ帳を見る</button></div>';
  view().innerHTML = h;
  view().querySelectorAll(".spine").forEach((x) => x.addEventListener("click", () => openBook(x.dataset.book)));
  $("cho").addEventListener("click", cho);
}

function openBook(id, only) {
  const b = BOOKS.find((x) => x.id === id);
  S = { b, list: makeOrder(b, only), i: 0, st: null, cards: null, got: [], lost: [], streak: 0, best: 0 };
  render(true);
}

function words(p) {
  const st = S.st;
  return p.w.map((x, k) => {
    const miss = st && st.miss === k ? " miss" : "";
    if (k === p.lie && (!st || st.choose)) return `<button class="w${st && st.choose ? " lie" : ""}" data-k="${k}">${p.bad}</button>`;
    if (k === p.lie) return `<span class="w ${st.ok ? "fixed" : "ans"}">${x}</span>`;
    return `<button class="w${miss}" data-k="${k}">${x}</button>`;
  }).join("");
}

function render(turn) {
  frame();
  const p = S.list[S.i], st = S.st, boss = p === bossOf(S.b);
  let h = `<div class="stage"><article class="page${boss ? " boss" : ""}${turn ? " turn" : ""}" style="--c:${S.b.c}">` +
    `<div class="head"><span class="art">${p.art}</span><span>${S.b.name}の巻　${S.i + 1} / ${S.list.length}</span></div>`;
  if (boss && !st) h += '<p style="margin:0"><span class="chip">巻末：大きなねじれ文字が潜んでいる</span></p>';
  if (S.streak >= 2 && !st) h += `<p class="streak">れんぞく ${S.streak}　札の力が強まっている</p>`;
  if (!st) {
    h += `<div class="text">${words(p)}</div><p class="q">うそに書き換えられた言葉をタップ。</p><button class="none" id="none">このページにうそは無い</button>`;
  } else if (st.choose) {
    if (!S.cards) S.cards = shuffle([p.w[p.lie], ...p.alt]);
    h += `<div class="text done">${words(p)}</div><p class="lurk">${monster(p, boss)}<span>ねじれ文字が姿を現した！ 正しい札をはめて封じる。</span></p>` +
      `<div class="cards">${S.cards.map((c) => `<button class="card">${c}</button>`).join("")}</div>`;
  } else {
    const clean = p.lie < 0;
    let face, head;
    if (clean) { face = '<span style="font-size:34px" aria-hidden="true">🏮</span>'; head = st.ok ? "見破った！ うそは無い。" : "このページに、うそは無かった。"; }
    else if (st.ok) { face = `<div class="fuda">${monster(p, false)}<span class="stamp">封</span></div>`; head = `封じた！ ねじれ「${p.bad}」`; }
    else { face = `<div class="flee">${monster(p, boss)}</div>`; head = `逃げられた… 正しくは「${p.w[p.lie]}」`; }
    h += `<div class="text done">${clean ? p.w.join("") : words(p)}</div>` +
      `<div class="res" id="res">${face}<p><b>${head}</b><br>${st.note ? st.note + "<br>" : ""}${p.why}</p></div>` +
      `<button class="btn go" id="next">${S.i < S.list.length - 1 ? "次のページへ" : "本を閉じる"}</button>`;
  }
  h += "</article></div>";
  view().innerHTML = h;
  view().querySelectorAll(".text:not(.done) .w").forEach((x) => x.addEventListener("click", () => pick(+x.dataset.k)));
  view().querySelectorAll(".card").forEach((x) => x.addEventListener("click", () => fit(x.textContent)));
  const n = $("none"); if (n) n.addEventListener("click", () => finish(p.lie < 0, p.lie < 0 ? null : `うそがあった。「${p.bad}」がねじれ文字。`));
  const g = $("next"); if (g) { g.focus({ preventScroll: true }); g.addEventListener("click", next); }
}

function pick(k) {
  const p = S.list[S.i];
  if (k === p.lie) { S.st = { choose: true }; render(); return; }
  finish(false, p.lie < 0 ? "そこは正しい。" : `そこは正しい。ねじれ文字は「${p.bad}」に化けていた。`, k);
}
function fit(c) { const p = S.list[S.i], ok = c === p.w[p.lie]; finish(ok, ok ? null : `「${c}」の札では封じられない。`); }
function finish(ok, note, miss) {
  const p = S.list[S.i];
  S.st = { done: true, ok, note, miss };
  if (ok) { mem.solved[p.id] = true; S.got.push(p); S.streak++; S.best = Math.max(S.best, S.streak); save(); }
  else { S.lost.push(p); S.streak = 0; }
  render();
}
function next() {
  S.i++; S.st = null; S.cards = null;
  if (S.i < S.list.length) render(true); else fin();
}

// 巻の終わり：封じた魔と逃がした魔。逃がしたぶんだけをすぐ追い直せる
function fin() {
  frame();
  const b = S.b, n = solvedIn(b), full = n === b.pages.length, lost = S.lost.slice();
  const slot = (p, out) => p.lie < 0 ? "" : `<div class="slot${out ? " out" : ""}">${monster(p, false)}<span class="nm">${p.bad}</span><span>${out ? "逃げた" : "封じた"}</span></div>`;
  const mons = S.got.map((p) => slot(p, false)).join("") + S.lost.map((p) => slot(p, true)).join("");
  view().innerHTML = `<div class="panel" id="fin"><h2>${full ? `${b.name}の巻を取り戻した！` : `${b.name}の巻 ${n} / ${b.pages.length} ページ`}</h2>` +
    `<p>${S.list.length}ページ中 ${S.got.length}ページを一度で直した。${S.best >= 3 ? `れんぞく ${S.best}！` : ""}</p>` +
    (mons ? `<div class="mons">${mons}</div>` : "") +
    `<div class="row">${lost.length ? '<button class="btn" id="chase">逃がした魔を追う</button>' : ""}<button class="btn sub2" id="back">本棚へ</button></div></div>`;
  const c = $("chase"); if (c) c.addEventListener("click", () => openBook(b.id, lost));
  $("back").addEventListener("click", shelf);
}

// 封じ帳：封じた魔の一覧（まだのところは「？」）
function cho() {
  let h = `<div class="panel cho" id="chobook"><h2>封じ帳</h2><p>封じた魔 ${MONS.filter((p) => mem.solved[p.id]).length} / ${MONS.length}</p>`;
  for (const b of BOOKS) {
    h += `<h3>${b.name}の巻</h3><div class="mons">` + b.pages.filter((p) => p.lie >= 0).map((p) => mem.solved[p.id]
      ? `<div class="slot got">${monster(p, p === bossOf(b))}<span class="nm">${p.bad}</span><span>${p.art}</span></div>`
      : '<div class="slot"><span class="q2">？</span><span>まだ</span></div>').join("") + "</div>";
  }
  h += '<div class="row"><button class="btn sub2" id="back">本棚へ</button></div></div>';
  view().innerHTML = h;
  $("back").addEventListener("click", shelf);
}

shelf();
</script>
</body>
