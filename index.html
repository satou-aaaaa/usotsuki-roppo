<!doctype html>
<html lang="ja">

<meta name="description" content="ねじれ文字に書き換えられた六法の本を、1ページずつ直して札に封じる学習ゲーム。">
<!-- ogp（sync-template の migrateOgp が足した。og.png を作ったら og:image と twitter:card を summary_large_image に替える） -->
<meta property="og:type" content="website">

<meta property="og:description" content="ねじれ文字に書き換えられた六法の本を、1ページずつ直して札に封じる学習ゲーム。">
<meta property="og:url" content="https://satou-aaaaa.github.io/usotsuki-roppo/">
<meta property="og:image" content="https://satou-aaaaa.github.io/usotsuki-roppo/icon-512.png">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-title" content="うそつき六法">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 夜の書庫：本棚で巻を選ぶ → 1ページに条文1つ。うその言葉をタップ → 札で正しい言葉をはめ、ねじれ文字を封じる */
:root{
  --sky1:#0d1030; --sky2:#232a5c; --sky3:#3b3570;
  --page:#f6efdd; --page2:#ecdfbf; --ink:#2a2420; --muted:#635a4f; --line:#d9cdb3;
  --gold:#e7b04f; --lamp:#ffcf73; --lie:#b0352b; --fix:#2f6e4f; --card:#fffaf0; --fuda:#f3e6c4; --seal:#b3261e;
  --text:#efe8d8;
  --display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
/* 夜の書庫は明るい設定でも暗い設定でも同じ色にする（紙の白さだけ少し落とす） */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#eee5cd;--card:#f6efdd}}
:root[data-theme="dark"]{--page:#eee5cd;--card:#f6efdd}
*{box-sizing:border-box}
html{background:var(--sky1)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 32% 8%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 58% 22%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 76% 12%,#fffa 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 30%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 44% 36%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 6% 44%,#fff7 50%,transparent 51%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%) var(--sky1);
  background-attachment:fixed}
body.dawn{--sky1:#2b2a5e;--sky2:#66356a;--sky3:#8c3a2e} /* 夜明けの空：上に白い字・灯りの字が乗るので、濃いめの朝焼け（字のコントラスト 4.5:1 以上） */
.moon{position:fixed;top:22px;right:max(22px,8vw);width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7dc,#f1d98f 60%,#d9b862);box-shadow:0 0 40px 10px #f6d77a33;pointer-events:none}
body.dawn .moon{background:radial-gradient(circle at 50% 50%,#fff3c4,#ffc35a 70%);box-shadow:0 0 70px 30px #ffbe5a55;top:auto;bottom:120px}
.wrap{position:relative;max-width:600px;margin:0 auto;padding-block:20px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-right:64px}
h1{font-family:var(--display);font-size:clamp(28px,8vw,40px);margin:0;line-height:1.1;letter-spacing:.06em;color:var(--lamp);
  text-shadow:0 0 18px #ffbf4f55}
/* 見やすさの「Aa」は上の欄に置く（左下に浮かせると本棚の説明・本文の下の行にかぶった。2026-11-07） */
.hstat{display:flex;align-items:center;gap:10px}
.hdr-a11y{background:#ffffff14!important;color:var(--lamp)!important;border-color:#e7b04f99!important}
/* 画面の部品どうしの間をあける（本棚の部品・とことんの説明が本にくっついていた。2026-11-07） */
#view{display:grid;gap:12px}
/* 幅の狭いスマホでは相棒の欄を小さくし、本棚と説明を最初の画面に入れる */
@media (max-width:360px){.buddy{padding:8px 12px;gap:10px}.buddy .buddy-svg{width:46px;height:60px}.buddy b{font-size:15px}.prolog{font-size:13px}}
.btn.leave{justify-self:center;font-size:13px;font-weight:500;padding:6px 18px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.sub{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:.1em}
.stat{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-size:20px;color:var(--lamp)}
button{font:inherit}
.btn{all:unset;cursor:pointer;background:linear-gradient(180deg,#ffd27e,var(--gold));color:#2a1d08;font-weight:700;padding:10px 22px;border-radius:999px;
  box-shadow:0 3px 0 #a8742a,0 6px 16px #0006;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8742a}
.btn.sub2{background:transparent;color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn:focus-visible,.w:focus-visible,.card:focus-visible,.spine:focus-visible,.none:focus-visible{outline:3px solid #fff;outline-offset:3px}
.prolog{margin:0;font-size:14px;opacity:.9}
/* 本棚 */
.shelf{position:relative;display:flex;gap:8px;align-items:flex-end;justify-content:center;padding:18px 12px 0;
  background:linear-gradient(180deg,#3a2616,#2a1a0e);border-radius:12px;box-shadow:inset 0 -14px 0 #1c1009,0 10px 30px #0008;min-height:220px}
.spine{all:unset;cursor:pointer;position:relative;width:min(15%,72px);border-radius:5px 5px 2px 2px;color:#f6e8c4;
  background:linear-gradient(90deg,#0004,transparent 18%,transparent 82%,#0005),var(--c);
  display:grid;justify-items:center;align-content:start;padding:12px 0 10px;gap:8px;margin-bottom:14px;
  box-shadow:0 4px 0 #0005;transition:transform .2s}
.spine:hover{transform:translateY(-6px)}
.spine .t{writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(15px,4.4vw,20px);letter-spacing:.2em;line-height:1}
.spine .band{width:70%;height:3px;background:var(--gold);opacity:.8}
.spine .n{font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}
.spine.done{box-shadow:0 0 0 2px var(--lamp),0 0 22px 4px #ffcf7355}
.spine.done::after{content:"✦";position:absolute;top:-16px;color:var(--lamp);font-size:14px;text-shadow:0 0 8px var(--lamp)}
.hint{font-size:12px;opacity:.85;margin:0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* 本のページ */
.stage{perspective:1400px}
.page{position:relative;background:
   radial-gradient(ellipse at 30% 20%,#fff8 0,transparent 55%),
   linear-gradient(90deg,#c9b68a 0,var(--page2) 3%,var(--page) 10%,var(--page) 94%,var(--page2) 100%);
  color:var(--ink);border-radius:4px 14px 14px 4px;padding:16px 18px 18px 26px;display:grid;gap:12px;min-height:300px;
  box-shadow:0 1px 0 #fff inset,0 18px 40px #000a,-6px 0 0 var(--c,#6b4b2a);transform-origin:left center}
.page.turn{animation:turn .5s cubic-bezier(.2,.7,.3,1)}
@keyframes turn{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
.page.boss{box-shadow:0 1px 0 #fff inset,0 18px 40px #000a,-6px 0 0 var(--c,#6b4b2a),0 0 0 3px #6b3fa0,0 0 34px 6px #8e5bd055}
.head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.art{font-family:var(--display);font-size:16px;color:#6a4a2a}
.chip{font-size:12px;background:#2a2042;color:#e8dbff;border-radius:999px;padding:1px 10px}
.streak{font-size:12px;color:#8f4512;font-weight:700;margin:0}
.text{font-family:var(--display);font-size:20px;line-height:2.15;letter-spacing:.02em}
.w{all:unset;cursor:pointer;border-bottom:2px dotted #b9a983;padding:0 1px;border-radius:3px;display:inline-block;min-height:44px;box-sizing:border-box;vertical-align:bottom}
.w:hover{background:#efe2bf}
.w.lie{color:var(--lie);display:inline-block;animation:twist 1.4s ease-in-out infinite;border-bottom:none;text-decoration:line-through wavy;text-decoration-thickness:1.5px}
@keyframes twist{0%,100%{transform:skewX(0) rotate(0)}25%{transform:skewX(-14deg) rotate(-2deg)}75%{transform:skewX(12deg) rotate(2deg)}}
.w.fixed{color:var(--fix);border-bottom:2px solid var(--fix);animation:glow 1.2s ease}
.w.fixed::after{content:"✓";font-size:.6em;vertical-align:super;margin-left:1px}
.w.ans{color:var(--fix);border-bottom:2px solid var(--fix)}
.w.miss{background:#f3d3cc;outline:2px dashed var(--lie);outline-offset:-2px}
.w.miss::before{content:"✕";color:var(--lie);font-size:.6em;vertical-align:super;margin-right:1px}
@keyframes glow{from{background:#fff1b8;box-shadow:0 0 18px #ffd86a}to{background:transparent}}
.text.done .w{cursor:default}
.q{font-size:13px;color:var(--muted);margin:0}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{all:unset;cursor:pointer;position:relative;background:linear-gradient(180deg,#fffdf6,var(--fuda));border:1.5px solid #c9a96a;border-radius:4px;
  padding:10px 14px 10px 26px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #c9a96a,0 6px 12px #0002;font-family:var(--display)}
.card::before{content:"札";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--seal)}
.card:hover{transform:translateY(-2px)}
.none,.shiori{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;border-radius:999px;border:1px solid #b9a983;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shiori{border-color:#c58a1c;color:#8a5a12;background:#fff4d6}
.w.okw{color:#4d5a4f;border-bottom:2px solid #9fc4ab;cursor:default;background:#e7f0e3}
.w.okw::before{content:"✓";color:var(--fix);font-size:.6em;vertical-align:super;margin-right:1px}
.res{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#efe6cf;border-radius:10px;padding:10px 12px}
.res p{margin:0;font-size:14px}
.res b{font-size:16px;font-family:var(--display)}
.go{justify-self:end}
/* ねじれ文字（魔）と札 */
.mon{width:64px;height:64px;overflow:visible}
.mon.big{width:84px;height:84px}
.mon .body{animation:wob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wob{0%,100%{scale:1 1}50%{scale:1.06 .94}}
.buddy{display:flex;gap:12px;align-items:center;background:#151838cc;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px}
.buddy b{font-family:var(--display);color:var(--lamp);font-size:16px}
.buddy p{margin:0;font-size:12px}
.buddy-svg{flex:none;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.buddy-svg.st3{filter:drop-shadow(0 0 8px #ffd96a)}
.gauge{display:inline-flex;align-items:center;gap:3px;color:#c58a1c;font-size:12px;letter-spacing:1px}
.gauge .buddy-svg{animation:none}
.page.power{animation:power 1.3s ease}
@keyframes power{30%{box-shadow:0 0 0 5px #ffd96a,0 0 70px 24px #ffd96acc}}
.res.power{background:linear-gradient(90deg,#fff1b8,#efe6cf)}
.learn{display:flex;align-items:center;gap:10px;color:var(--lamp);font-family:var(--display);font-size:16px}
.lurk{display:flex;align-items:center;gap:10px;font-size:13px;color:#5b3f86;margin:0}
.lurk .mon{animation:rise .5s ease-out}
@keyframes rise{from{transform:translateY(16px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.fuda{position:relative;width:62px;height:88px;background:linear-gradient(180deg,#fffaf0,var(--fuda));border:2px solid var(--seal);border-radius:3px;
  display:grid;place-items:center;box-shadow:0 4px 10px #0003}
.fuda .mon{width:48px;height:48px;animation:suck .8s cubic-bezier(.5,0,.3,1) both}
@keyframes suck{from{transform:scale(2.2) rotate(-40deg);opacity:1}70%{opacity:1}to{transform:scale(.8) rotate(0);opacity:.85}}
.fuda .stamp{position:absolute;bottom:4px;right:4px;width:24px;height:24px;border-radius:4px;background:var(--seal);color:#fff;
  font-family:var(--display);font-size:15px;display:grid;place-items:center;animation:stamp .4s .6s both}
@keyframes stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.flee .mon{animation:flee 1s ease-in forwards}
@keyframes flee{to{transform:translate(40px,-24px) rotate(30deg) scale(.6);opacity:.15}}
/* 巻の終わり・封じ帳 */
.panel{background:#151838cc;border:1px solid #ffffff22;border-radius:14px;padding:16px;display:grid;gap:12px}
.panel h2{font-family:var(--display);font-size:24px;margin:0;color:var(--lamp)}
.panel p{margin:0}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:2px;text-align:center;font-size:11px;min-width:0}
.slot .nm{font-family:var(--display);font-size:13px;color:#ffd9d2;text-decoration:line-through wavy #ff8a80;overflow-wrap:anywhere}
.slot.out{border-style:dashed}.slot.out .mon{opacity:.45}
.slot .q2{font-family:var(--display);font-size:28px;opacity:.4;height:52px;display:grid;place-items:center}
.cho h3{font-family:var(--display);font-size:16px;margin:6px 0 0;color:var(--lamp)}
/* 村 */
.town{width:100%;height:auto;display:block;margin-top:6px}
.town .win{fill:#2a2a3a}
.town .win.lit{fill:var(--lamp);filter:drop-shadow(0 0 4px #ffcf73)}
footer{display:grid;gap:6px;font-size:12px;opacity:.9}
footer p{margin:0}
footer a{color:var(--lamp)}
.ask{font-size:13px;opacity:.85;border-top:1px dashed #ffffff22;padding-top:10px}
.ask a{color:var(--lamp)}
/* 完封・実績・カレンダー */
.spine .kan{position:absolute;bottom:-12px;width:22px;height:22px;border-radius:4px;background:var(--seal);color:#fff;font-family:var(--display);font-size:13px;line-height:22px;text-align:center;box-shadow:0 2px 6px #0007}
.kanpu{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;color:var(--lamp);margin:0}
.kanpu .big{width:44px;height:44px;border-radius:6px;background:var(--seal);color:#fff;font-size:26px;display:grid;place-items:center;animation:stamp .5s both;box-shadow:0 0 18px #ff8a8055}
.newach{font-size:13px;margin:0;color:#ffe3a0}
.achs{display:grid;gap:8px}
.ach{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:10px;padding:8px 10px;min-width:0}
.ach .ic{font-size:22px;text-align:center}
.ach b{font-family:var(--display);font-size:15px;color:var(--lamp);display:block}
.ach small{font-size:12px;opacity:.85;display:block;overflow-wrap:anywhere}
.ach .pr{font-size:12px;font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap}
.ach.no{border-style:dashed}.ach.no .ic{filter:grayscale(1);opacity:.6}
.ach.got{border-color:#e7b04f88;background:#e7b04f14}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-family:var(--display);font-size:18px;color:var(--lamp)}
.calhead .btn{padding:6px 14px;min-width:44px;min-height:44px;box-sizing:border-box;display:grid;place-items:center}
.calhead .btn[disabled]{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .dw{opacity:.7}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;align-content:center;line-height:1.2;background:#ffffff08;font-variant-numeric:tabular-nums;min-width:0}
.cal .d.l1{background:#e7b04f5c}.cal .d.l2{background:#e7b04fb8;color:#2a1d08}.cal .d.l3{background:var(--lamp);color:#2a1d08;font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px #fff}
/* 灯りの段は色の濃さだけでなく点の数でも分ける（1段 •・2段 ••・3段 •••） */
.cal .d.l1::after,.cal .d.l2::after,.cal .d.l3::after,.keys i::after{font-size:9px;line-height:1;letter-spacing:-1px}
.cal .d.l1::after,.keys i.k1::after{content:"•"}.cal .d.l2::after,.keys i.k2::after{content:"••"}.cal .d.l3::after,.keys i.k3::after{content:"•••"}
.cal .d.fut{opacity:.75;background:transparent}
.calnote{font-size:12px;opacity:.85}
.keys{display:flex;gap:10px;align-items:center;font-size:12px;opacity:.85;flex-wrap:wrap}
.keys i{display:inline-block;min-width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:3px;font-style:normal;color:#2a1d08;text-align:center;line-height:14px;padding:0 1px}
/* とことん */
.btn.wide{display:block;box-sizing:border-box;width:100%}
.btn.wide small{font-weight:400;font-size:12px;opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.escore{font-family:var(--display);font-size:30px;color:var(--lamp);margin:0}
.spine .first{position:absolute;top:-30px;white-space:nowrap;font-size:11px;font-weight:700;background:var(--lamp);color:#2a1d08;border-radius:999px;padding:0 8px;box-shadow:0 2px 6px #0007}
.mode{display:grid;justify-items:center;gap:4px}
.mode .btn{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.peek-tag{margin:0;font-size:13px;font-weight:700;color:var(--fix)}
.text.clean .w{border-bottom-color:transparent;cursor:default}
/* 色の見分けを助ける（html.a11y-cvd）：うそ＝朱・直した/正しい＝青の組（カラーユニバーサルデザイン）に替え、印を太くする */
html.a11y-cvd{--lie:#A63D00;--fix:#005A8C}
html.a11y-cvd .w.fixed,html.a11y-cvd .w.ans{border-bottom-width:3px}
html.a11y-cvd .w.miss{background:#ffe2c2;outline-width:3px}
html.a11y-cvd .w.okw{background:#dcebf7;border-bottom-color:#0072B2}
html.a11y-cvd .w.lie{text-decoration-thickness:2.5px}
html.a11y-cvd .slot.out{border-width:2px}
/* 読み上げソフトだけに届く知らせ（#live） */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
/* all:unset のボタンでも、キーで選んだときの枠を必ず出す（いちばん最後に強く書く） */
:is(.btn,.w,.card,.spine,.none,.shiori,button,a):focus-visible{outline:3px solid #fff!important;outline-offset:3px}
</style>
<!-- a11y:begin 見やすさの設定 v10（shared-workflows template/a11y/a11y.html の写し。ここでは直さず、ひな形を直して全部のゲームへ写す。drift-check と qa/a11y.mjs が同じ中身か見る） -->
<style id="a11y-css">
/* だれでも：キーボードで選んだ所に太い枠（WCAG 2.4.7・2.4.13） */
:is(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid #1a5fd0!important;outline-offset:2px!important;box-shadow:0 0 0 5px #fff!important}
/* 読みやすい文字：UD フォント・行間 1.7・字間を少し広げる・斜体にしない（BDA Dyslexia Style Guide） */
html.a11y-read body{line-height:1.7}

  function show(text, done) {
    queue.push([text, done]);
    if (!bar || !bar.isConnected) next();
  }
  function next() {
    const it = queue.shift();
    if (bar) { bar.remove(); bar = null; }

    btn.addEventListener("click", () => { try { it[1] && it[1](); } catch (e) { /* 書けない */ } next(); });

  function gameNews() {

  }

  for (let i = 0; i < n; i++) d += " Q" + f(pts[i]) + " " + f(mid(pts[i], pts[(i + 1) % n]));
  const ex = 9 + r() * 5, ey = -4 - r() * 6, er = 6 + r() * 4, tilt = (r() - 0.5) * 30;
  const eye = (x) => `<circle cx="${x.toFixed(1)}" cy="${ey.toFixed(1)}" r="${er.toFixed(1)}" fill="#fff6dd"/><circle cx="${(x + (r() - 0.5) * 4).toFixed(1)}" cy="${(ey + 1.5).toFixed(1)}" r="${(er * 0.45).toFixed(1)}" fill="#1a1020"/>`;
  const horns = big ? `<path d="M-18 -30 L-26 -50 L-8 -34Z M18 -30 L26 -50 L8 -34Z" fill="${p.book.c}"/>` : "";
  return `<svg class="mon${big ? " big" : ""}" viewBox="-60 -60 120 120" aria-hidden="true"><g transform="rotate(${tilt.toFixed(0)})"><g class="body">${horns}` +
    `<path d="${d}" fill="#231a33" stroke="${p.book.c}" stroke-width="4"/>${eye(-ex)}${eye(ex)}` +
    `<path d="M-10 14 l5 -4 l5 4 l5 -4 l5 4" fill="none" stroke="#ff8a80" stroke-width="2.5" stroke-linecap="round"/></g></g></svg>`;
}

// 上の数字と村の灯り（取り戻した巻の数だけ家に灯りがともる。6冊で夜明け）
function frame() {
  const sealed = MONS.filter((p) => mem.solved[p.id]).length;
  $("stat").innerHTML = `封じた魔 <b>${sealed}</b> / ${MONS.length}`;
  let h = '<path d="M0 90 L0 70 Q150 52 300 66 T600 60 L600 90Z" fill="#0b0d22"/>';
  BOOKS.forEach((b, i) => {
    const x = 30 + i * 95, y = 40 + (i % 2) * 6, lit = solvedIn(b) === b.pages.length;
    h += `<path d="M${x} ${y + 40} V${y + 12} L${x + 22} ${y - 4} L${x + 44} ${y + 12} V${y + 40}Z" fill="#141733"/>` +
      `<rect class="win${lit ? " lit" : ""}" data-book="${b.id}" x="${x + 15}" y="${y + 18}" width="14" height="12" rx="2"/>`;
  });
  $("town").innerHTML = h;
  $("town").setAttribute("aria-label", `村の灯り（${BOOKS.length}軒のうち${BOOKS.filter((b) => solvedIn(b) === b.pages.length).length}軒がともる）`);
  document.body.classList.toggle("dawn", allDone());
}

// 相棒のしおり：本に住む小さな相棒。取り戻した巻ごとに技を1つ覚えて姿が育つ。3ページ続けて直すと大技が出る
const ARTS = { ken: "礎の灯", min: "結びの糸", kei: "戒めの鎖", sho: "算盤の風", mso: "天秤の盾", kso: "黙の帳" };
const POWER = 3;
const learned = () => BOOKS.filter((b) => solvedIn(b) === b.pages.length).map((b) => ARTS[b.id]);
const stageOf = (n) => (n >= 6 ? 3 : n >= 4 ? 2 : n >= 2 ? 1 : 0);
function buddy(big) {
  const st = stageOf(learned().length), fill = st === 3 ? "#ffd96a" : "#f6ecd2", k = (big ? 0.9 : 0.34) * (0.85 + st * 0.1);
  return `<svg class="buddy-svg st${st}" viewBox="-40 -60 80 104" width="${Math.round(80 * k)}" height="${Math.round(104 * k)}" aria-hidden="true">` +
    '<path d="M0 -42 V-52" stroke="#b3261e" stroke-width="3"/><circle cx="0" cy="-54" r="4" fill="#b3261e"/>' +
    (st >= 1 ? '<path d="M-22 4 l-11 -9 M22 4 l11 -9" stroke="#c9a96a" stroke-width="4" stroke-linecap="round"/>' : "") +
    `<path d="M-22 -40 H22 V38 L0 26 L-22 38Z" fill="${fill}" stroke="#c9a96a" stroke-width="3" stroke-linejoin="round"/>` +
    (st >= 2 ? '<path d="M0 -36 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z" fill="#e7b04f"/>' : "") +
    '<circle cx="-8" cy="-10" r="3.2" fill="#2a2420"/><circle cx="8" cy="-10" r="3.2" fill="#2a2420"/>' +
    '<ellipse cx="-13" cy="-2" rx="4" ry="2.4" fill="#f2a39a"/><ellipse cx="13" cy="-2" rx="4" ry="2.4" fill="#f2a39a"/>' +
    '<path d="M-4 0 Q0 5 4 0" stroke="#2a2420" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
}
// 大技の名前：この巻の技を覚えていればそれ、無ければ覚えた技のどれか、まだ何も無ければ「しおりの灯」
function techFor(b) { const xs = learned(); return xs.includes(ARTS[b.id]) ? ARTS[b.id] : xs.length ? xs[Math.floor(Math.random() * xs.length)] : "しおりの灯"; }

// 本棚
function shelf() {
  Core.screens.route({}, shelf); Core.screens.mark(""); // スマホの「戻る」でゲームから出ずに本棚へ（共通部品 game-core）
  S = null; frame(); window.scrollTo(0, 0);
  const done = allDone();
  let h = done ? '<div class="panel" id="dawn"><h2>夜明け！</h2><p>六法をすべて取り戻した。村じゅうに灯りがともった。</p></div>'
    : '<p class="prolog">夜のうちに、ねじれ文字が六法の言葉をうそに書き換えた。うその言葉を見つけ、正しい札で封じよう。</p>';
  const novice = !Object.values(mem.solved).some(Boolean);
  const arts = learned();
  h += `<div class="buddy" id="buddy">${buddy(true)}<div><b>相棒のしおり</b><p>覚えた技：${arts.length ? arts.join("・") : "まだ無い（巻を取り戻すと覚える）"}</p><p>3ページ続けて直すと、大技が出る。</p></div></div>`;
  h += '<div class="shelf" id="shelf">' + BOOKS.map((b, i) => {
    const n = solvedIn(b), full = n === b.pages.length;
    const kan = !!mem.kanpu[b.id], first = novice && b.id === FIRST;
    return `<button class="spine${full ? " done" : ""}" data-book="${b.id}" style="--c:${b.c};height:${170 + (i % 3) * 14}px" aria-label="${b.name}の巻（${n}/${b.pages.length}${kan ? "・完封" : ""}${first ? "・はじめはここから" : ""}）">` + (first ? '<span class="first" aria-hidden="true">はじめに</span>' : "") +
      `<span class="band"></span><span class="t">${b.name}</span><span class="band"></span><span class="n">${n}/${b.pages.length}</span>${kan ? '<span class="kan" aria-hidden="true">完</span>' : ""}</button>`;
  }).join("") + "</div>";
  h += `<p class="hint">本をタップして開く。どの巻からでもよい。1回に6ページずつ読む。</p>${endBtn(false)}<div class="mode"><button class="btn sub2" id="easy" aria-pressed="${easy()}">${easy() ? "📖 下読みあり" : "⚔️ 下読みなし"}</button><p class="hint" id="easyhint">${easy() ? "先に正しい条文を読んでから、うそを探す" : "いきなりうそを探す（完封はこちら）"}</p></div><div class="row"><button class="btn sub2" id="cho">封じ帳</button><button class="btn sub2" id="achbtn">実績</button><button class="btn sub2" id="calbtn">カレンダー</button></div>`;
  view().innerHTML = h;
  view().querySelectorAll(".spine").forEach((x) => x.addEventListener("click", () => openBook(x.dataset.book)));
  $("cho").addEventListener("click", cho);
  // 画面に出ている値を反転し、読み直しのあとに書く（save() は読み直しで保存済みの設定に戻すので使わない）
  $("easy").addEventListener("click", () => { const shown = easy(); try { merge(); } catch (e) { /* 読めなくても続ける */ } mem.opt.easy = !shown; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* 記録できなくても続ける */ } shelf(); });
  $("achbtn").addEventListener("click", achView);
  $("calbtn").addEventListener("click", () => calView(today().slice(0, 7)));
  bindEnd();
}
// とことんの大きなボタン（本棚と巻の終わりの画面）。はじめて来た人も押せる（まだどの巻も読んでいなければ全部の巻から出す）
function endBtn(after) {
  const r = runOk(mem.erun) ? mem.erun : null, best = mem.ebest ? ` <small>自己ベスト ${mem.ebest}ページ</small>` : "";
  if (r) return `<button class="btn wide" id="go-e">とことんの続きから（${answered(r) + 1}ページ目）${best}</button>`;
  return `<button class="btn wide" id="go-e">${after ? `続けて遊ぶ：とことん${mem.ebest ? `（ベスト ${mem.ebest}ページ）` : ""}` : `とことん：何ページ続けて直せる？${best}`}</button>`;
}
function bindEnd() { const e = $("go-e"); if (e) e.addEventListener("click", startEndless); }

function openBook(id, only) {
  const b = BOOKS.find((x) => x.id === id);
  S = { b, list: makeOrder(b, only), i: 0, st: null, cards: null, got: [], lost: [], streak: 0, best: 0, wasFull: solvedIn(b) === b.pages.length,
    only: !!only, hint: 1, hinted: false, marked: [], easy: easy(), peek: easy() };
  render(true);
}
// とことんを始める（途中の回があれば続きから）
function startEndless() {
  try { merge(); } catch (e) { /* 読めなくても続ける */ }
  let r = runOk(mem.erun) ? mem.erun : null;
  if (!r) { // id は時刻と、前に終えた回の続き番号（時計が同じでも、終えた回と同じ id にしない）
    const list = endlessList();
    if (!list.length) return shelf();
    r = mem.erun = { id: `${Date.now()}-${(parseInt(mem.edone.split("-")[1], 10) || 0) + 1}`, list: list.map((p) => p.id), i: 0, n: 0, miss: 0 };
    save();
  } else if (r.i >= r.list.length) { refill(r); save(); }
  const list = r.list.map((id) => byId[id]);
  S = { mode: "e", eid: r.id, b: list[r.i].book, list, i: r.i, st: null, cards: null, got: [], lost: [], streak: 0, best: 0, only: false, hint: 0, hinted: false, marked: [], easy: peekE(list[r.i]), peek: peekE(list[r.i]) };
  render(true);
}

function words(p) {
  const st = S.st;
  return p.w.map((x, k) => {
    const miss = st && st.miss === k ? " miss" : "";
    if (k === p.lie && st && st.choose) return `<span class="w lie" data-k="${k}" >${p.bad}<span class="sr">（うその言葉）</span></span>`;
    if (k === p.lie && !st) return `<button class="w" data-k="${k}">${p.bad}</button>`;
    if (k === p.lie) return `<span class="w ${st.ok ? "fixed" : "ans"}" >${x}<span class="sr">（${st.ok ? "直した" : "正しい言葉"}）</span></span>`;
    if (!st && S.marked.includes(k)) return `<span class="w okw" >${x}<span class="sr">（しおり：正しい）</span></span>`;
    if (st) return `<span class="w${miss}" data-k="${k}">${x}${miss ? '<span class="sr">（選んだ言葉）</span>' : ""}</span>`;
    return `<button class="w" data-k="${k}">${x}</button>`;
  }).join("");
}

function render(turn) {
  Core.screens.mark("read");
  frame(); if (turn) window.scrollTo(0, 0);
  if (S.mode === "e") S.b = S.list[S.i].book;
  // 下読みの間は巻末の枠を付けない（枠でうそがあると分かってしまう）
  const p = S.list[S.i], st = S.st, boss = p === bossOf(S.b) && !(!st && S.peek), er = S.mode === "e" ? mem.erun : null;
  const gv = st && st.power ? POWER : S.streak % POWER;
  let h = `<div class="stage"><article class="page${boss ? " boss" : ""}${turn ? " turn" : ""}${st && st.power ? " power" : ""}" style="--c:${S.b.c}">` +
    `<div class="head"><span class="art">${p.art}</span><span class="gauge" id="gauge" aria-label="しおりの力 ${gv}/${POWER}">${buddy(false)}${"●".repeat(gv)}${"○".repeat(POWER - gv)}</span>${er ? `<span id="epage">とことん　${answered(er) + (st && st.done ? 0 : 1)}ページ目</span>` : `<span>${S.b.name}の巻　${S.i + 1} / ${S.list.length}</span>`}</div>`;
  if (!st && S.peek) {
    // 下読み：正しい条文だけを見せる（うそがあるかどうかは言わない）
    h += '<p class="peek-tag" id="peek">📖 下読み：これが正しい条文</p>' +
      `<div class="text done clean" tabindex="-1" data-a11y-say>${p.w.map((x) => `<span class="w">${x}</span>`).join("")}</div>` +
      '<p class="q" data-a11y-say>しおり「覚えたら、めくってね。ねじれ文字が1か所を書き換えるかも」</p>' +
      '<button class="btn go" id="flip">めくる</button></article></div>' +
      (er ? `<p class="hint" id="ehint">まちがえても続く。好きなところで降りられる。</p><button class="btn sub2 wide" id="quit">ここで降りる（${answered(er)}ページで終える）</button>` : '<button class="btn sub2 leave" id="leave">本棚へもどる</button>');
    view().innerHTML = h;
    const lv0 = $("leave"); if (lv0) lv0.addEventListener("click", shelf);
    const qt0 = $("quit"); if (qt0) qt0.addEventListener("click", () => endFin());
    const fl = $("flip"); const ptx = view().querySelector(".text"); (turn && ptx ? ptx : fl).focus({ preventScroll: true }); fl.addEventListener("click", () => { S.peek = false; render(true); });
    return;
  }
  if (boss && !st) h += '<p style="margin:0"><span class="chip">巻末：大きなねじれ文字が潜んでいる</span></p>';
  if (S.streak % POWER === POWER - 1 && !st) h += '<p class="streak">しおりの力が、あと1つで満ちる！</p>';
  if (!st) {
    h += `<div class="text" tabindex="-1" data-a11y-say>${words(p)}</div><p class="q" data-a11y-say>${S.marked.length ? "しおり「緑で ✓ の付いた言葉は正しいよ」" : S.easy ? "下読みとちがう言葉をタップ。同じなら下のボタン。" : "うそに書き換えられた言葉をタップ。"}</p>` +
      `<div class="tools"><button class="none" id="none">このページにうそは無い</button>${S.hint > 0 ? '<button class="shiori" id="shiori">🔖 しおりに聞く</button>' : ""}</div>`;
  } else if (st.choose) {
    if (!S.cards) S.cards = shuffle([p.w[p.lie], ...p.alt]);
    h += `<div class="text done" data-a11y-say>${words(p)}</div><p class="lurk">${monster(p, boss)}<span data-a11y-say>ねじれ文字が姿を現した！ 正しい札をはめて封じる。</span></p>` +
      `<div class="cards">${S.cards.map((c) => `<button class="card">${c}</button>`).join("")}</div>`;
  } else {
    const clean = p.lie < 0;
    let face, head;
    if (clean) { face = '<span style="font-size:34px" aria-hidden="true">🏮</span>'; head = st.ok ? "見破った！ うそは無い。" : "このページに、うそは無かった。"; }
    else if (st.ok) { face = `<div class="fuda">${monster(p, false)}<span class="stamp">封</span></div>`; head = `封じた！ ねじれ「${p.bad}」`; }
    else { face = `<div class="flee">${monster(p, boss)}</div>`; head = `逃げられた… 正しくは「${p.w[p.lie]}」`; }
    if (st.power) { head = `しおりの大技「${st.power}」！ ` + head; if (clean) face = `<span>${buddy(true)}</span>`; }
    S.said = `${head}${st.note ? " " + st.note : ""}`;
    h += `<div class="text done">${clean ? p.w.join("") : words(p)}</div>` +
      `<div class="res${st.power ? " power" : ""}" id="res">${face}<p data-a11y-say><b>${head}</b><br>${st.note ? st.note + "<br>" : ""}${p.why}</p></div>` +
      `<button class="btn go" id="next">${er ? "次のページへ" : S.i < S.list.length - 1 ? "次のページへ" : "本を閉じる"}</button>`;
  }
  h += "</article></div>";
  if (er) h += `<p class="hint" id="ehint">まちがえても続く。好きなところで降りられる。</p><button class="btn sub2 wide" id="quit">ここで降りる（${answered(er)}ページで終える）</button>`;
  else h += '<button class="btn sub2 leave" id="leave">本棚へもどる</button>'; // 巻の途中でも本棚へ戻れる（直したページはもう記録してある）
  view().innerHTML = h;
  view().querySelectorAll(".text:not(.done) button.w").forEach((x) => x.addEventListener("click", () => pick(+x.dataset.k)));
  view().querySelectorAll(".card").forEach((x) => x.addEventListener("click", () => fit(x.textContent)));
  // キーで遊ぶ人が迷わないよう、描き直したら次に押す所へ枠を移す（答え合わせは「次へ」、札を選ぶときは最初の札）
  const fc = view().querySelector(".card"); if (fc) fc.focus({ preventScroll: true });
  const n = $("none"); if (n) n.addEventListener("click", () => finish(p.lie < 0, p.lie < 0 ? null : `うそがあった。「${p.bad}」がねじれ文字。`));
  const sh = $("shiori"); if (sh) sh.addEventListener("click", () => { S.hint--; S.hinted = true; S.marked = hintWords(p); render(); });
  const g = $("next"); if (g) { g.focus({ preventScroll: true }); g.addEventListener("click", next); }
  // 答え合わせが長いページ（憲法の巻の ken9 など）は、320×640 のスマホで「次へ」が画面の下に隠れていた。答えたら「次へ」まで見えるように下げる（2026-11-17）
  // めくる・大技の動き（transform）の途中で測るとずれるので、動きに左右されない offsetTop で位置を出す
  if (g && st && st.done) { let y = 0; for (let e = g; e; e = e.offsetParent) y += e.offsetTop; const low = y + g.offsetHeight + 8; if (low > scrollY + innerHeight) window.scrollTo(0, low - innerHeight); }
  // 新しいページは本文へ枠を移して読み上げさせる（#view は丸ごと読み上げないので）
  if (!st && turn) { const tx = view().querySelector(".text"); if (tx) tx.focus({ preventScroll: true }); }
  if (st && st.done) tell(S.said); else if (st && st.choose) tell("ねじれ文字が姿を現した。正しい札を選ぶ。"); else if (S.marked.length && S.hinted && S.hint === 0 && !S.toldHint) { S.toldHint = true; tell(`しおり：✓ の付いた言葉 ${S.marked.length}つは正しい。`); }
  const qt = $("quit"); if (qt) qt.addEventListener("click", () => endFin());
  const lv = $("leave"); if (lv) lv.addEventListener("click", shelf);
}

function pick(k) {
  const p = S.list[S.i];
  if (k === p.lie) { S.st = { choose: true }; render(); return; }
  finish(false, p.lie < 0 ? "そこは正しい。" : `そこは正しい。ねじれ文字は「${p.bad}」に化けていた。`, k);
}
function fit(c) { const p = S.list[S.i], ok = c === p.w[p.lie]; finish(ok, ok ? null : `「${c}」の札では封じられない。`); }
function finish(ok, note, miss) {
  const p = S.list[S.i];
  S.st = { done: true, ok, note, miss };
  try { merge(); } catch (e) { /* 読めなくても続ける */ } // 別のタブで同じ日に読んだページ数に足す
  if (S.mode === "e") { // とことん：封じ帳・その日の数には入れず、回の進み具合だけ残す。別の画面で進んだ回なら数えない（二重に入れない）
    const r = mem.erun;
    if (!runOk(r) || r.id !== S.eid || r.i !== S.i || r.list[r.i] !== p.id) return shelf(); // 番号だけでなくページも同じか見る（同じ数のまま別のタブで並びが替わったとき。2026-11-06 CodeRabbit）
    r.miss = missOf(r); r.i++; if (ok) r.n++; else r.miss++;
    refill(r);
    if (ok) { S.got.push(p); S.streak++; S.best = Math.max(S.best, S.streak); if (S.streak % POWER === 0) S.st.power = techFor(S.b); }
    else { S.lost.push(p); S.streak = 0; }
    save(); render(); return;
  }
  const d = today(); mem.days[d] = (mem.days[d] || 0) + 1;
  // この回の1ページで巻がそろったときだけ「新しい技」を出す（別のタブでそろえた巻では出さない）
  if (ok && !mem.solved[p.id] && solvedIn(S.b) === S.b.pages.length - 1) S.madeFull = true;
  if (ok) { mem.solved[p.id] = true; S.got.push(p); S.streak++; S.best = Math.max(S.best, S.streak); if (S.streak % POWER === 0) S.st.power = techFor(S.b); }
  else { S.lost.push(p); S.streak = 0; }
  save();
  render();
}
function next() {
  if (S.mode === "e") { // 進み具合は保存した回に合わせる（並びを読み終えて新しい並びに替わっていても続く）
    const a0 = runOk(mem.erun) ? answered(mem.erun) : -1;
    try { merge(); } catch (e) { /* 読めなくても続ける */ } // 先に読み直す：別のタブで進んだ回・直したページに合わせる（2026-11-08 CodeRabbit）
    const r = mem.erun; if (!runOk(r) || r.id !== S.eid) return endFin();
    if (answered(r) !== a0) S.streak = 0; // 別のタブで答えたページがあれば、このタブの「続けて直した数」は途切れたものとする（大技を出しすぎない）
    if (r.i >= r.list.length) { refill(r); save(); } // 別のタブ（前の版）が並びの最後まで進めていたら、新しい並びに替えてから続ける（2026-11-08 CodeRabbit）
    S.list = r.list.map((id) => byId[id]); S.i = r.i; S.st = null; S.cards = null; S.marked = []; S.toldHint = false;
    S.easy = S.peek = peekE(S.list[S.i]);
    return render(true);
  }
  S.i++; S.st = null; S.cards = null; S.marked = []; S.toldHint = false; S.peek = S.easy;
  if (S.i < S.list.length) render(true); else fin();
}

// 巻の終わり：封じた魔と逃がした魔。逃がしたぶんだけをすぐ追い直せる
// 応援のひとこと：遊び終えて満足したときだけ（巻を初めて取り戻したとき・夜明け）出す。遊ぶ前や途中には出さない
function ask(id) { return `<p class="ask" id="${id}">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener noreferrer">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しい巻づくりの励みになります（任意・遊ぶのはずっと無料）。</p>`; }
function fin() {
  Core.screens.mark("result");
  try { merge(); } catch (e) { /* 読めなくても続ける */ }
  frame(); window.scrollTo(0, 0); // 巻の終わりは上（巻の名前）から見せる（下のほうで「本を閉じる」を押すと、途中から出ていた）
  const b = S.b, n = solvedIn(b), full = n === b.pages.length, lost = S.lost.slice();
  const slot = (p, out) => p.lie < 0 ? "" : `<div class="slot${out ? " out" : ""}">${monster(p, false)}<span class="nm">${p.bad}</span><span>${out ? "逃げた" : "封じた"}</span></div>`;
  const mons = S.got.map((p) => slot(p, false)).join("") + S.lost.map((p) => slot(p, true)).join("");
  // 完封：ふつうの1回（6ページ）を、しおりに聞かずに全部一度で直した。巻の背に「完」の印が付く
  const full6 = !S.only && S.list.length === PER, perfect = full6 && !S.lost.length && !S.hinted && !S.easy, firstKan = perfect && !mem.kanpu[b.id];
  if (perfect) mem.kanpu[b.id] = 1;
  const fresh8 = achNow(mem).filter((a) => a.done && !mem.ach[a.id]);
  fresh8.forEach((a) => { mem.ach[a.id] = 1; });
  save();
  view().innerHTML = `<div class="panel" id="fin"><h2 data-a11y-say>${full ? `${b.name}の巻を取り戻した！` : `${b.name}の巻 ${n} / ${b.pages.length} ページ`}</h2>` +
    (perfect ? `<p class="kanpu" id="kanpu"><span class="big" aria-hidden="true">完</span><span>完封！${firstKan ? `<br><small>${b.name}の巻に印が付いた</small>` : ""}</span></p>` : "") +
    `<p>${S.list.length}ページ中 ${S.got.length}ページを一度で直した。${S.best >= 3 ? `れんぞく ${S.best}！` : ""}</p>` +
    (full6 && !perfect ? `<p class="hint" id="kanhint">${S.easy ? "下読みなしで" : S.hinted ? "しおりに聞かずに" : ""}6ページを一度で直すと「完封」。</p>` : "") +
    (fresh8.length ? `<p class="newach" id="newach">🏅 実績：${fresh8.map((a) => a.name).join("・")}</p>` : "") +
    (full && S.madeFull ? `<p class="learn" id="learn">${buddy(true)}<span>相棒のしおりが、新しい技「${ARTS[b.id]}」を覚えた！</span></p>` : "") +
    (mons ? `<div class="mons">${mons}</div>` : "") +
    `<div class="row">${lost.length ? '<button class="btn" id="chase">逃がした魔を追う</button>' : full ? "" : '<button class="btn" id="more">続きを読む</button>'}<button class="btn sub2" id="back">本棚へ</button></div>` + endBtn(true) +
    (full && S.madeFull ? ask("askfin") : "") + `</div>`;
  tell(`${full ? `${b.name}の巻を取り戻した。` : `${b.name}の巻 ${n}/${b.pages.length}ページ。`}${perfect ? "完封。" : ""}${fresh8.length ? `実績：${fresh8.map((a) => a.name).join("・")}。` : ""}`);
  const c = $("chase"); if (c) c.addEventListener("click", () => openBook(b.id, lost));
  const m = $("more"); if (m) m.addEventListener("click", () => openBook(b.id));
  $("back").addEventListener("click", shelf);
  bindEnd();
}

// とことんの終わり：直したページ数を自己ベストと比べる（ほかの人との順位は出さない）
function endFin() {
  Core.screens.mark("result");
  try { merge(); } catch (e) { /* 読めなくても続ける */ }
  const r = runOk(mem.erun) ? mem.erun : null;
  if (!r || (S && S.mode === "e" && S.eid !== r.id)) return shelf();
  const n = r.n, prev = mem.ebest || 0, miss = missOf(r);
  mem.ebest = Math.max(prev, n); mem.erun = null; mem.edone = r.id; mem.edones = [...mem.edones.filter((x) => x !== r.id), r.id].slice(-20);
  save(); S = null; frame();
  const best = n > prev;
  view().innerHTML = `<div class="panel" id="efin"><h2>とことん</h2><p class="escore" id="eres">${n}ページ 直した</p>` +
    `<p id="ebest">${best ? "🎉 自己ベスト更新！" : `自己ベスト ${mem.ebest}ページ${mem.ebest >= n ? `（あと${mem.ebest - n + 1}ページで更新）` : ""}`}</p>` +
    `<p id="emiss">めくったページ ${n + miss}・まちがい ${miss}</p>` +
    '<button class="btn wide" id="go-e">もう一度とことん</button><div class="row"><button class="btn sub2" id="back">本棚へ</button></div></div>';
  bindEnd(); $("back").addEventListener("click", shelf);
  window.scrollTo(0, 0);
}

// 封じ帳：封じた魔の一覧（まだのところは「？」）
function cho() {
  Core.screens.mark("cho");
  let h = `<div class="panel cho" id="chobook"><h2>封じ帳</h2><p>封じた魔 ${MONS.filter((p) => mem.solved[p.id]).length} / ${MONS.length}</p>`;
  for (const b of BOOKS) {
    h += `<h3>${b.name}の巻</h3><div class="mons">` + b.pages.filter((p) => p.lie >= 0).map((p) => mem.solved[p.id]
      ? `<div class="slot got">${monster(p, p === bossOf(b))}<span class="nm">${p.bad}</span><span>${p.art}</span></div>`
      : '<div class="slot"><span class="q2">？</span><span>まだ</span></div>').join("") + "</div>";
  }
  h += '<div class="row"><button class="btn sub2" id="back">本棚へ</button></div></div>';
  view().innerHTML = h;
  $("back").addEventListener("click", shelf);
}

// 実績：とれたものは ✓、まだのものは条件と進み具合（いま/目標）
function achView() {
  Core.screens.mark("ach");
  const xs = achNow(mem);
  view().innerHTML = `<div class="panel" id="achview"><h2>実績</h2><p>${xs.filter((a) => a.done).length} / ${xs.length}</p><div class="achs">` +
    xs.map((a) => `<div class="ach ${a.done ? "got" : "no"}" data-id="${a.id}"><span class="ic" aria-hidden="true">${a.ic}</span><span><b>${a.name}</b><small>${a.how}</small></span>` +
      `<span class="pr">${a.done ? "✓" : `${a.cur}/${a.goal}`}</span></div>`).join("") +
    '</div><div class="row"><button class="btn sub2" id="back">本棚へ</button></div></div>';
  $("back").addEventListener("click", shelf);
}

// カレンダー：遊んだ日に灯り（読んだページが多いほど明るい）。前の月へ戻れる。休んだ日には何も書かない
const lvOf = (n) => (n >= 12 ? 3 : n >= 6 ? 2 : n >= 1 ? 1 : 0);
function calView(ym) {
  Core.screens.mark("cal");
  const t = today(), now = t.slice(0, 7), played = Object.keys(mem.days).filter((d) => mem.days[d] > 0).sort();
  const first = played.length && played[0].slice(0, 7) < now ? played[0].slice(0, 7) : now;
  if (ym > now) ym = now; if (ym < first) ym = first;
  const [y, m] = ym.split("-").map(Number), start = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), len = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const shift = (k) => { const x = new Date(Date.UTC(y, m - 1 + k, 1)); return x.toISOString().slice(0, 7); };
  let g = "日月火水木金土".split("").map((w) => `<span class="dw">${w}</span>`).join("") + "<span></span>".repeat(start);
  for (let i = 1; i <= len; i++) {
    const d = `${ym}-${String(i).padStart(2, "0")}`, n = mem.days[d] || 0;
    g += `<span class="d l${lvOf(n)}${d === t ? " today" : ""}${d > t ? " fut" : ""}" data-day="${d}"${n ? ` aria-label="${i}日 ${n}ページ"` : ""}>${i}</span>`;
  }
  const st = streakOf(mem.days, t);
  view().innerHTML = `<div class="panel" id="calview"><h2>カレンダー</h2>` +
    `<div class="calhead"><button class="btn sub2" id="prevm" aria-label="前の月"${ym <= first ? " disabled" : ""}>‹</button><b>${y}年${m}月</b>` +
    `<button class="btn sub2" id="nextm" aria-label="次の月"${ym >= now ? " disabled" : ""}>›</button></div><div class="cal" id="cal">${g}</div>` +
    `<p class="keys"><span><i class="k1" style="background:#e7b04f5c;color:#efe8d8" aria-hidden="true"></i>読んだ</span><span><i class="k2" style="background:#e7b04fb8" aria-hidden="true"></i>6ページ</span><span><i class="k3" style="background:var(--lamp)" aria-hidden="true"></i>12ページ</span></p>` +
    `<p class="calnote" id="calnote">遊んだ日 合計 ${played.length}日${st >= 1 ? `<span id="streak">・続けて ${st}日</span>` : ""}</p>` +
    '<div class="row"><button class="btn sub2" id="back">本棚へ</button></div></div>';
  $("prevm").addEventListener("click", () => calView(shift(-1)));
  $("nextm").addEventListener("click", () => calView(shift(1)));
  $("back").addEventListener("click", shelf);
}

shelf();
// ホーム画面に置けて、電波が無くても遊べるようにする（sw.js）。ファイルを直接開いたとき（file://）は使えないので何もしない
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
